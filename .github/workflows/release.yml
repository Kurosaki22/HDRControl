name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "hdr-control-publish"
          dotnet publish .\HDRControl.App\HDRControl.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            --output $publishDirectory

          $files = @(Get-ChildItem $publishDirectory -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "HDRControl.exe") {
            throw "Expected HDRControl.exe as the only publish output."
          }

          "PUBLISH_DIRECTORY=$publishDirectory" >> $env:GITHUB_ENV

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            (Join-Path $env:PUBLISH_DIRECTORY "HDRControl.exe") `
            --title "HDR Control $env:GITHUB_REF_NAME" `
            --generate-notes
